name: Portfolio content
on:
  push:
    paths: ["assets/portfolio-*", "assets/visioneye.*", "robo-skill-lab/**", "scripts/**", "*.html", "work/**", "sitemap.xml", ".github/workflows/portfolio.yml"]
  pull_request:
    paths: ["assets/portfolio-*", "assets/visioneye.*", "robo-skill-lab/**", "scripts/**", "*.html", "work/**", "sitemap.xml", ".github/workflows/portfolio.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate from shared bilingual content
        run: node scripts/build-portfolio.cjs
      - name: Check committed pages are current
        run: git diff --exit-code -- '*.html' work sitemap.xml
      - name: Validate links, fragments and translations
        run: node scripts/check-portfolio.cjs
      - name: Verify published Serving Lab evidence against source
        run: node scripts/check-serving-evidence.cjs
      - name: Validate the playable Fall in Korea portfolio demo
        run: node scripts/check-fall-in-korea.cjs
      - name: Run the published merge-game regression tests
        run: node --test work/fall-in-korea/source/tests/*.test.js

      - name: Verify RoboSkill simulation evidence
        run: node scripts/check-roboskill-evidence.cjs
